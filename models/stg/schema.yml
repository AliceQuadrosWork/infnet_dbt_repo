version: 2

models:
  - name: stg_clientes
    description: "Tabela de clientes tratada na camada staging, contendo informações cadastrais, contato, localização e indicadores financeiros dos clientes."

    columns:
      - name: cliente_id
        description: "Identificador único do cliente."
        tests:
          - not_null
          - unique

      - name: nome_completo
        description: "Nome completo do cliente."

      - name: email
        description: "Endereço de e-mail do cliente utilizado para comunicação."
        tests:
          - not_null
          - unique

      - name: telefone
        description: "Número de telefone para contato do cliente."

      - name: cpf
        description: "Documento de identificação fiscal do cliente (CPF)."
        tests:
          - not_null
          - unique

      - name: genero
        description: "Gênero informado pelo cliente."

      - name: status_cliente
        description: "Situação atual do cliente no sistema."

      - name: data_nascimento
        description: "Data de nascimento do cliente."

      - name: cidade
        description: "Cidade onde o cliente está localizado."

      - name: estado
        description: "Estado ou região administrativa do cliente."

      - name: pais
        description: "País de residência do cliente."

      - name: renda_mensal
        description: "Renda mensal declarada pelo cliente."

      - name: score_credito
        description: "Pontuação de crédito atribuída ao cliente."

      - name: data_cadastro
        description: "Data e horário em que o cliente foi cadastrado."

      - name: ativo
        description: "Indicador que informa se o cliente está ativo no sistema."